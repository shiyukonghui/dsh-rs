[workspace]
resolver = "2"
members = [
  "crates/dsh-core", "crates/dsh-loader", "crates/dsh-eval", "crates/dsh-schema",
  "crates/dsh-diff", "crates/dsh-wasmrt", "crates/dsh-cli",
  # M0 契约基建（PLAN-rust-full-harness-migration.md §4）：数据面先行
  "crates/dsh-brand", "crates/dsh-llm", "crates/dsh-session", "crates/dsh-persistence", "crates/dsh-api",
  # M1 运行时（PLAN §5）：llm 适配器 + 压缩 + 持久化 + 读模型查询
  "crates/dsh-llm-deepseek", "crates/dsh-compaction",
  "crates/dsh-session-query",
  # M2 运行时（PLAN §6）：agent 驱动链 —— 作用域原语 / 工具能力缝 / 系统提示 /
  # agent 注册表 / agent loop / interaction 审批链
  "crates/dsh-scope", "crates/dsh-tools", "crates/dsh-system-prompt",
  "crates/dsh-agent", "crates/dsh-agent-loop",
  # M3 宿主（PLAN §6）：settings/credentials 能力缝 + file 提供者（web gui 配置面）
  "crates/dsh-settings", "crates/dsh-credentials",
  # M4 长任务编排（PLAN §6）：goal/plan/subagent/jobs/schedule/workflow
  "crates/dsh-goal", "crates/dsh-plan", "crates/dsh-subagent",
  "crates/dsh-jobs", "crates/dsh-schedule", "crates/dsh-workflow",
  # M5 执行引擎与沙箱（PLAN §7 + M5-DESIGN.md §1）：subprocess/sandbox/fs/shell/terminal/code-runtime
  "crates/dsh-subprocess", "crates/dsh-sandbox", "crates/dsh-fs",
  "crates/dsh-shell", "crates/dsh-terminal", "crates/dsh-code-runtime",
  # presets（B+C）：per-session agent preset 组合（发现/挂载/服务桥，路径 B）
  "crates/dsh-agent-presets",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# HANDOFF §8：工具链要求 Rust 1.94+；1.85 为 wit-bindgen/wasm-tools 组件模型的 MSRV 下限
rust-version = "1.85"
license = "MIT"

[profile.release]
debug = true
