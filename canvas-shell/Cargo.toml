[package]
name = "canvas-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# D-210 壳重写（选项 C）：桌布渲染器 Rust 化（Dioxus web）。
# 独立 [workspace]：与主仓库/dsh-cli 依赖树完全隔离（同 wasm-plugins 模式）。
[dependencies]
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console", "Document", "Element", "HtmlElement", "Window",
  "Request", "RequestInit", "RequestMode", "Response", "Headers", "Event",
] }

[workspace]
