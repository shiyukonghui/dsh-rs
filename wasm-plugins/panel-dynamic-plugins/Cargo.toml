[package]
name = "panel-dynamic-plugins-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

# 面板改写 #3（D-188）：动态插件清单卡（复用 dsh:host-remote 接口身份）。
[package.metadata.component]
package = "dsh:panel-dynamic-plugins"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"dsh:host-remote" = { path = "../../crates/dsh-wasmrt/wit-host-remote" }

[workspace]
