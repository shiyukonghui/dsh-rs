[package]
name = "panel-runtime-status-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

# 面板改写 #2（D-187）：运行时状态卡（复用 dsh:host-remote 接口身份）。
[package.metadata.component]
package = "dsh:panel-runtime-status"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"dsh:host-remote" = { path = "../../crates/dsh-wasmrt/wit-host-remote" }

[workspace]
