[package]
name = "llm-deepseek-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

# P2 试点：llm-deepseek 服务装配单元（复用 dsh:host-remote 接口身份 ->
# 宿主 WasmRemoteEndpointPlugin 无需改绑定即可加载）。
[package.metadata.component]
package = "dsh:llm-deepseek"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"dsh:host-remote" = { path = "../../crates/dsh-wasmrt/wit-host-remote" }

[workspace]
