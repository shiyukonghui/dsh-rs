<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>llm-deepseek · P2 声明式 UI 试点</title>
    <style>
      body { font: 14px/1.6 system-ui, sans-serif; margin: 2rem auto; max-width: 640px; color: #1f2328; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, select { width: 100%; box-sizing: border-box; padding: .4rem; margin-top: .25rem; }
      fieldset { border: 1px solid #d0d7de; border-radius: 6px; margin-top: 1rem; }
      .actions { margin-top: 1.5rem; }
      button { padding: .5rem 1rem; margin-right: .5rem; border-radius: 6px; border: 1px solid #d0d7de; cursor: pointer; }
      button.primary { background: #0969da; color: #fff; border-color: #0969da; }
      #status { margin-top: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
      .ok { color: #1a7f37; } .err { color: #cf222e; }
    </style>
  </head>
  <body>
    <h1 id="title">llm-deepseek</h1>
    <p id="description"></p>
    <form id="ui"></form>
    <div class="actions" id="actions"></div>
    <div id="status"></div>
    <script src="renderer.js"></script>
  </body>
</html>
