[package]
name = "dsh-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M2b: 工具能力缝（schema DSL→JSON Schema / 子集断言 / 值校验 / defineTool / ToolRuntime 注册表+执行管线），镜像 TS @deepseek-ai/dsh-tools。"

[dependencies]
dsh-llm = { path = "../dsh-llm" }
dsh-scope = { path = "../dsh-scope" }
serde = { version = "1", features = ["derive"] }
# D-014：serde_json 默认 BTreeMap 规范序（与 dsh-diff 一致），不用 preserve_order。
serde_json = "1"

[dev-dependencies]
serde_json = "1"

