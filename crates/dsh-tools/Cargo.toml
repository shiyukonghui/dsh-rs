[package]
name = "dsh-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M2b: 工具能力缝（schema DSL→JSON Schema / 子集断言 / 值校验 / defineTool / ToolRuntime 注册表+执行管线），镜像 TS @deepseek-ai/dsh-tools。"

[dependencies]
dsh-llm = { path = "../dsh-llm" }
dsh-scope = { path = "../dsh-scope" }
# M4h：todo_write 下沉用 dsh-session-query::todo（to_todo_list/todo_counts）；workflow
# 参数级 meta 校验用 dsh-workflow::validate_meta。两者不依赖 dsh-tools（无环）。
dsh-session-query = { path = "../dsh-session-query" }
dsh-workflow = { path = "../dsh-workflow" }
serde = { version = "1", features = ["derive"] }
# D-014：serde_json 默认 BTreeMap 规范序（与 dsh-diff 一致），不用 preserve_order。
serde_json = "1"
# M2b-3b：Python SDK 生成的 Unicode 面——XID_Start/XID_Continue 表 + NFKC 归一化
# （对齐 TS py-types.ts 的 isBareIdentifier/camelCase）。版本偏斜记 D-026/D-027。
unicode-ident = "1"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"

