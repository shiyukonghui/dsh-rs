[package]
name = "dsh-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scenario DSL runner and normalized-trace diff harness for Cordis-equivalence verification (M5)."

[dependencies]
dsh-core = { path = "../dsh-core" }
dsh-loader = { path = "../dsh-loader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
