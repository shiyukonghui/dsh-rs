[package]
name = "dsh-wasmrt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wasmtime backend for dsh: load WASM plugins (core-module C ABI + component model) as dsh-core Plugin."

[dependencies]
dsh-core = { path = "../dsh-core" }
serde_json = "1"
wasmtime = { version = "34", features = ["component-model"] }
wasmtime-wasi = { version = "34", features = ["preview1"] }

[dev-dependencies]
dsh-loader = { path = "../dsh-loader" }
tokio = { version = "1", features = ["rt", "macros"] }
