[package]
name = "dsh-wasmrt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wasmtime backend for dsh: load WASM plugins (core-module C ABI + component model) as dsh-core Plugin."

[dependencies]
# dsh-eval = 组合求值的 **native 面**（WASM 面的同源备份/兜底；K4/F-05）。
dsh-core = { path = "../dsh-core" }
dsh-eval = { path = "../dsh-eval" }
serde_json = "1"
wasmtime = { version = "34", features = ["component-model"] }
wasmtime-wasi = { version = "34", features = ["preview1"] }

[dev-dependencies]
dsh-agent-presets = { path = "../dsh-agent-presets" }
dsh-loader = { path = "../dsh-loader" }
# D-217 m42：薄服务单元对拍（native 语义面 = 同一 crate 的宿主侧执行）。
dsh-plan = { path = "../dsh-plan" }
dsh-session = { path = "../dsh-session" }
tokio = { version = "1", features = ["rt", "macros"] }
