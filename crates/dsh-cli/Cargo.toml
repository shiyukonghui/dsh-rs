[package]
name = "dsh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DSH layer launcher: boot from cordis.yml (services + WASM loop), drive one turn."

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
dsh-core = { path = "../dsh-core" }
dsh-loader = { path = "../dsh-loader" }
dsh-wasmrt = { path = "../dsh-wasmrt" }
dsh-agent = { path = "../dsh-agent" }
dsh-agent-loop = { path = "../dsh-agent-loop" }
dsh-session = { path = "../dsh-session" }
dsh-persistence = { path = "../dsh-persistence" }
dsh-llm = { path = "../dsh-llm" }
dsh-tools = { path = "../dsh-tools" }
dsh-system-prompt = { path = "../dsh-system-prompt" }
dsh-scope = { path = "../dsh-scope" }
dsh-brand = { path = "../dsh-brand" }
dsh-settings = { path = "../dsh-settings" }
dsh-credentials = { path = "../dsh-credentials" }
dsh-schema = { path = "../dsh-schema" }
# M4h: web RPC wiring — goal/subagent 纯域服务 + session-query 投影注册表
dsh-goal = { path = "../dsh-goal" }
dsh-subagent = { path = "../dsh-subagent" }
dsh-session-query = { path = "../dsh-session-query" }
# M4h 补实：jobs/schedule 宿主服务 seam（工具 bind + 帧 + 到期注入）
dsh-jobs = { path = "../dsh-jobs" }
dsh-schedule = { path = "../dsh-schedule" }
# M5h: 执行工具接线 — fs/shell/terminal/code-runtime/sandbox 服务 + 纯面
dsh-fs = { path = "../dsh-fs" }
dsh-shell = { path = "../dsh-shell" }
dsh-sandbox = { path = "../dsh-sandbox" }
dsh-terminal = { path = "../dsh-terminal" }
dsh-code-runtime = { path = "../dsh-code-runtime" }
dsh-subprocess = { path = "../dsh-subprocess" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12.0"
tungstenite = { version = "0.26", default-features = false }
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
