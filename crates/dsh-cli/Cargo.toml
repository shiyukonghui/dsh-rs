[package]
name = "dsh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DSH layer launcher: boot from cordis.yml (services + WASM loop), drive one turn."

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
dsh-core = { path = "../dsh-core" }
dsh-loader = { path = "../dsh-loader" }
dsh-wasmrt = { path = "../dsh-wasmrt" }
dsh-session = { path = "../dsh-session" }
dsh-persistence = { path = "../dsh-persistence" }
dsh-brand = { path = "../dsh-brand" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12.0"
tungstenite = { version = "0.26", default-features = false }
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
