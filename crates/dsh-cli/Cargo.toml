[package]
name = "dsh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DSH layer launcher: boot from cordis.yml (services + WASM loop), drive one turn."

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
dsh-contract = { path = "../dsh-contract" }
dsh-core = { path = "../dsh-core" }
dsh-loader = { path = "../dsh-loader" }
dsh-wasmrt = { path = "../dsh-wasmrt" }
dsh-agent = { path = "../dsh-agent" }
dsh-agent-loop = { path = "../dsh-agent-loop" }
dsh-session = { path = "../dsh-session" }
dsh-persistence = { path = "../dsh-persistence" }
dsh-llm = { path = "../dsh-llm" }
dsh-llm-deepseek = { path = "../dsh-llm-deepseek" }
dsh-tools = { path = "../dsh-tools" }
dsh-system-prompt = { path = "../dsh-system-prompt" }
dsh-scope = { path = "../dsh-scope" }
dsh-brand = { path = "../dsh-brand" }
dsh-settings = { path = "../dsh-settings" }
dsh-credentials = { path = "../dsh-credentials" }
dsh-schema = { path = "../dsh-schema" }
# D-115-Web（D2）：wasm remote 端点的宿主侧真实 uuid（messageFeedback version 源）。
uuid = { version = "1", features = ["v4"] }
# M4h: web RPC wiring — goal/subagent 纯域服务 + session-query 投影注册表
dsh-goal = { path = "../dsh-goal" }
dsh-subagent = { path = "../dsh-subagent" }
dsh-session-query = { path = "../dsh-session-query" }
# M4h 补实：jobs/schedule 宿主服务 seam（工具 bind + 帧 + 到期注入）
dsh-jobs = { path = "../dsh-jobs" }
dsh-schedule = { path = "../dsh-schedule" }
# L1（D-105）：plan-mode 宿主 —— 会话 `plan/mode` 事件折叠 + exit_plan_mode 前置校验
dsh-plan = { path = "../dsh-plan" }
# M5h: 执行工具接线 — fs/shell/terminal/code-runtime/sandbox 服务 + 纯面
dsh-fs = { path = "../dsh-fs" }
dsh-shell = { path = "../dsh-shell" }
dsh-sandbox = { path = "../dsh-sandbox" }
dsh-terminal = { path = "../dsh-terminal" }
dsh-code-runtime = { path = "../dsh-code-runtime" }
dsh-subprocess = { path = "../dsh-subprocess" }
# P1-b（B+C）：per-session agent preset 组合 —— 发现/解析/根（mount 是 P2）
dsh-agent-presets = { path = "../dsh-agent-presets" }
# P2-a（P4 select）：过程门面求值（disabled_expr / __jsExpr）
dsh-eval = { path = "../dsh-eval" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12.0"
tungstenite = { version = "0.26", default-features = false }
sha1 = "0.10"
# D-183：桌布 C2 清单 rev 的 sha256 内容哈希（已在 lock + 本地缓存，零新增供应链）。
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }

# D-210 S5 尾项：Rust 壳资产构建期 gzip 预压缩（表随 build.rs 生成）。
# 纯 Rust miniz_oxide 后端（默认 feature），零 C 工具链。
[build-dependencies]
flate2 = "1"

# D-098：原生目录选择（host.pickDirectory）——Windows 进程内 IFileDialog/COM。
# 用新版 windows crate（接口自 windows-sys 0.59 起迁移至此；0.62 成熟可用）。
# 仅 Windows 目标引入；非 Windows 走 host_picker 的平台回落（目录选择不可用）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
