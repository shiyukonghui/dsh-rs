[package]
name = "dsh-code-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M5 code execution seam: CodeRuntime trait, python subprocess backend (stdin/stdout JSON-lines lossless protocol, user logs via log frames, D-066), run_code tool wiring, honest TS worker stub (port of the dsh code-runtime capability seam)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dsh-tools = { path = "../dsh-tools" }
dsh-subprocess = { path = "../dsh-subprocess" }
