[package]
name = "dsh-code-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M5 code execution seam: CodeRuntime trait, python subprocess backend with fd-3 JSON-lines lossless protocol, run_code tool wiring, honest TS worker stub (port of the dsh code-runtime capability seam)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dsh-tools = { path = "../dsh-tools" }
dsh-subprocess = { path = "../dsh-subprocess" }

[dev-dependencies]
tempfile = "3"
