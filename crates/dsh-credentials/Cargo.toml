[package]
name = "dsh-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of the dsh credential-reference capability seam (resolve/describe/set/unset over environment and a local file)."

[dependencies]
dsh-persistence = { path = "../dsh-persistence" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
