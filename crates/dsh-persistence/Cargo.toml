[package]
name = "dsh-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M1d (dsh-persistence)：SessionPersistence seam + format/zstd/jsonl 原生后端 + coordinator + write-behind + import。"

[dependencies]
dsh-brand = { path = "../dsh-brand" }
dsh-session = { path = "../dsh-session" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13.3"

[dev-dependencies]
serde_json = "1"
