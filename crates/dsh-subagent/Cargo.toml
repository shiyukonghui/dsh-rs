[package]
name = "dsh-subagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of the dsh subagent capability seam (in-process spawn/fork providers, catalog, descriptor, control: history/prompt/interrupt)."

[dependencies]
dsh-session = { path = "../dsh-session" }
dsh-persistence = { path = "../dsh-persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
