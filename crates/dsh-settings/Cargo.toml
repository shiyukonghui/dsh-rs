[package]
name = "dsh-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of the dsh user-settings capability seam (namespace registry, layered resolution, redaction, file persistence)."

[dependencies]
dsh-schema = { path = "../dsh-schema" }
dsh-persistence = { path = "../dsh-persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
